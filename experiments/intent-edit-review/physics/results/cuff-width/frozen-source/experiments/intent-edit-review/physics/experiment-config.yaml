版本: 服装物理引擎条件实验-1
用途: 验证数值计算、接触、约束、热图和回放；不是实测材料或真人合身批准
参数状态: 实验估计，未实测标定
原型:
  规格: patterns/fitted-tshirt/input-spec.yaml
  图形: patterns/fitted-tshirt/input.dxf
单位:
  每U毫米数: 1.0
  状态: 实验假定，不改写原规格中的未标定状态
  依据: 袖片纵线约593U、前后胸横线合计约858U，与厘米参考尺寸量级接近；这不是单位证明
人体:
  文件: tools/engine-cloth-lab/reference/assets/makehuman.json
  身份: 库内MakeHuman标准人体，不是用户扫描或实测人体
  几何处理: 保留该文件的米制位置和全部三角面；不缩小人体规避碰撞
面料:
  参考候选: 1253号40支棉氨纶料
  照片挂牌成分: 棉95.5%、氨纶4.5%
  挂牌克重_克每平方米: 155.0
  面密度_千克每平方米: 0.155
  厚度_米: 0.0005
  图面横向模量_Pa: 120000.0
  图面纵向模量_Pa: 200000.0
  图面剪切模量_Pa: 30000.0
  泊松比: 0.2
  本构: 研究用正交各向异性StVK平面应力
  重要说明: 厚度、弹性及剪切参数为实验值，不从成分和克重推导，不是这块面料的实测值；纱向待确认
弯曲:
  方法: 有向二面角XPBD；材料休止角为平面，不叠加第二套展开距离弯曲约束
  启用展开距离弯曲约束: false
  二面角弯曲刚度估计_牛米: 0.000001
  试验二面角上限_度: 120.0
  角约束每轮最大点修正_毫米: 1.0
  折角限制说明: 明确加入的数值试验约束；不是这块面料的实测折角限制，也不改变独立零穿插验收
  标定状态: 未标定弯曲刚度，不预测永久折痕
  跨裁片接缝: 仅共享位置约束；不把两套不连续材料坐标当成平铺休止角；缝线转动刚度未标定
数值条件:
  膜求解: 全局隐式Euler，质量预条件L-BFGS，对同一StVK与惯性总目标作实际float32位置线搜索
  膜求解边界: 每次膜更新降低该目标；后续人体、折角及布料接触投影单独检查，不宣称共同全局能量下降
  网格采样间距_U: 20.0
  接触间距_毫米: 1.0
  单轮接触最大修正_毫米: 2.0
  记录步数: 60
  固定步长_秒: 0.008333333333333333
  重力_米每二次方秒: 9.81
  人体: 刚性
  布料自接触间距_毫米: 1.0
  布料接触单点修正上限_毫米: 0.5
  布料接触求解迭代: 4
  自接触距离计算分辨率_毫米: 0.0001
  距离分辨率说明: 与米制float32坐标的约0.1微米量级匹配；仅提前保守保留候选，不清除不确定碰撞，不改变独立1微米零穿插验收
  身体与布料接触交替轮数: 8
  表面接触修正迭代: 1
  实际面穿越修正: 双向实际边面交点生成局部分离平面与重心约束；不以有限采样点代替真实三角表面检查
  穿着初始位置松弛迭代: 480
  初始化接触距离过渡轮数: 192
  每步数值速度保留比例: 0.2
  接触摩擦系数估计: 0.3
  阻尼说明: 强数值黏性阻尼，用于受控稳定性实验；不是实测空气或面料阻尼，不能据此预测真实摆动速度
  初始化接触距离起点_毫米: 1.0
  初始化方法: 对来源绑定外壳作连续深度定位，再启用真实人体碰撞；不改人体坐标，准备过程不是物理回放
  初始深度放大: 2.2
  初始深度平移_毫米: 40.0
  前臂初始向前位移上限_毫米: 220.0
  初始定位说明: 仅调整初始三维位置，使前后片位于人体正确两侧；不改二维材料坐标，不把初始形状固定为最终结果
  袖子预变形: false
  使用材料坐标FEM初始化: true
  按标准人体骨架定位袖子: true
  袖子定位说明: 使用同源原始OBJ关节及标准人体实际坐标，使肩肘腕进入袖管；仅改变准备位置，不改变人体或二维纸样，不代表合身批准
  FEM初始化说明: 固定来源壳边界，按原二维材料坐标的有限元权重重求内部定位；仅为准备种子，仍须独立检查人体及自穿插
  初始顶点接触投影: false
  初始位置说明: 先作静态穿着初始化并保存全部准备过程诊断，再从就绪的初始状态记录真实物理步；初始化不是实测穿衣过程
验收:
  最大接缝间隙_毫米: 2.0
  最大离散穿入_毫米: 0.2
  严格三角面穿插数: 0
  热图颜色分量误差: 0.000002
  回放状态: 实际保存的坐标、上一时刻坐标、时间、接触及场；seek不得积分
  材料实测与真人试穿: NOT_RUN
