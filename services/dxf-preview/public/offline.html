<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pattern Agent · 离线三维预览</title><style>body{margin:0;background:#faf9f4;color:#213e34;font:14px/1.8 Arial,'Microsoft YaHei',sans-serif}main{max-width:760px;margin:30px auto;padding:20px}h1{font-size:26px;font-weight:400}canvas{display:block;width:100%;height:650px;background:#43484a;touch-action:none}button{padding:10px 15px;background:#294d40;color:white;border:0;font:inherit;cursor:pointer}label{margin-left:20px}p{font-size:12px;color:#68746b}@media(max-width:600px){canvas{height:480px}}</style></head><body><main><h1>纸样三维外观预览</h1><p>由上传纸样计算生成。人体厚度与面料为展示假定，实际合身性未验证。</p><canvas id="canvas" tabindex="0" aria-label="可旋转的三维模型"></canvas><div><button id="reset">重置视角</button><label><input type="checkbox" id="wireframe">显示网格</label></div><p>拖动旋转，滚轮缩放。完整报告见同包中的报告文件。</p><p id="error" role="status"></p></main><script>__RENDERER_JS__</script><script>window.createGarmentRenderer(document.getElementById('canvas'),'data:model/gltf-binary;base64,__GENERATED_GLB__',document.getElementById('wireframe')).then(r=>{r.draw();document.getElementById('reset').onclick=()=>r.reset();document.getElementById('wireframe').onchange=()=>r.draw();}).catch(()=>{document.getElementById('error').textContent='浏览器不支持此三维预览，请使用兼容查看器打开同包中的模型文件。';});</script></body></html>
