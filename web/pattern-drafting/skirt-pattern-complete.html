<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; img-src data:; font-src data:; media-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>从零打版｜A 字裙全流程</title>
<style>
:root {color-scheme:light dark;--background:#f5f0e7;--foreground:#2e222c;--card:#fffaf2;--viz-series-1:#a6344d}
@media(prefers-color-scheme:dark){:root{--background:#251e25;--foreground:#f9eae5;--card:#30252e;--viz-series-1:#ff9bb0}}
*{box-sizing:border-box}
body{margin:0;background:var(--background);color:var(--foreground);font:16px/1.55 system-ui,sans-serif}
main{width:min(100% - 28px,880px);margin:28px auto 48px}
header{border-top:3px solid var(--foreground);padding:12px 0 15px}
h1{font-size:clamp(31px,5vw,55px);letter-spacing:-.045em;line-height:1.1;margin:0}
header p{margin:8px 0 0;color:var(--viz-series-1)}
#fused-skirt h2{font-size:clamp(24px,4vw,34px);line-height:1.2}
#fused-skirt [data-scene]{background:var(--card);border-radius:10px}
.btn{font:inherit;color:var(--foreground);background:var(--card);border:1px solid color-mix(in srgb,var(--foreground) 27%,var(--card));padding:7px 11px;min-height:44px;border-radius:7px;cursor:pointer}
.btn[aria-pressed="true"],.btn-primary{background:var(--foreground);color:var(--card)}
.btn:disabled{opacity:.42;cursor:default}
:focus-visible{outline:3px solid var(--viz-series-1);outline-offset:3px}
main>details{margin-top:18px;border-top:1px solid color-mix(in srgb,var(--foreground) 25%,var(--background));padding-top:10px}
details p,details ul{max-width:68ch}
summary{cursor:pointer}
a{color:var(--viz-series-1)}
</style>
</head>
<body>
<main>
<header><h1>从零打版</h1><p>一条 A 字裙，从款式图到裁片</p></header>
<style>
#fused-skirt {
  --ink:var(--foreground,#211d28);
  --paper:var(--card,#fffaf2);
  --accent-ink:var(--viz-series-1,#ad3449);
  --soft:color-mix(in srgb,var(--accent-ink) 13%,var(--paper));
  --cloth:color-mix(in srgb,var(--accent-ink) 31%,var(--paper));
  --rule:color-mix(in srgb,var(--ink) 16%,var(--paper));
  color:var(--ink); display:grid; gap:12px; min-width:0;
}
#fused-skirt [data-steps],#fused-skirt .actions {display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#fused-skirt .actions {justify-content:space-between}
#fused-skirt h2,#fused-skirt p {margin:0}
#fused-skirt .stage {min-width:0}
#fused-skirt svg {display:block;width:100%;height:auto}
#fused-skirt svg text {fill:var(--ink);font:500 25px system-ui,sans-serif}
#fused-skirt svg .small {font-size:24px}
#fused-skirt svg .measure {font-size:30px;font-weight:650}
#fused-skirt svg .outline {fill:none;stroke:var(--ink);stroke-width:2.6}
#fused-skirt svg .paper {fill:var(--paper);stroke:var(--ink);stroke-width:2.6}
#fused-skirt svg .cloth {fill:var(--cloth);stroke:var(--ink);stroke-width:2.6}
#fused-skirt svg .highlight {fill:var(--soft);stroke:var(--accent-ink);stroke-width:2.6}
#fused-skirt svg .accent {fill:none;stroke:var(--accent-ink);stroke-width:3}
#fused-skirt svg .guide {fill:none;stroke:var(--ink);stroke-width:1.6;stroke-dasharray:7 6;opacity:.5}
#fused-skirt svg .rule {fill:none;stroke:var(--rule);stroke-width:1.2}
#fused-skirt svg .cut {fill:var(--soft);stroke:var(--ink);stroke-width:2.6}
#fused-skirt svg .dot {fill:var(--accent-ink);stroke:var(--paper);stroke-width:2}
#fused-skirt .draw {stroke-dasharray:1;stroke-dashoffset:0}
#fused-skirt .playing .draw {animation:skirt-draw 850ms ease both;animation-delay:var(--delay,0ms)}
#fused-skirt .playing .appear {animation:skirt-appear 300ms ease both;animation-delay:var(--delay,0ms)}
@keyframes skirt-draw {from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes skirt-appear {from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){
  #fused-skirt .playing .draw,#fused-skirt .playing .appear {animation:none}
}
#fused-skirt {--ink:var(--foreground,#33232c);--paper:var(--background,#f9f1e9);--mark:var(--viz-series-1,#a63550);display:grid;gap:12px;color:var(--ink)}
#fused-skirt nav{display:flex;gap:6px;flex-wrap:wrap}
#fused-skirt p,#fused-skirt h2{margin:0}
#fused-skirt svg{width:100%;height:auto;display:block}
#fused-skirt svg text{font:500 26px system-ui,sans-serif;fill:var(--ink)}
#fused-skirt svg .big{font-size:38px;font-weight:650}
#fused-skirt svg .small{font-size:24px}
#fused-skirt svg .line{fill:none;stroke:var(--ink);stroke-width:2.4}
#fused-skirt svg .paper{fill:var(--paper);stroke:var(--ink);stroke-width:2.6}
#fused-skirt svg .tint{fill:color-mix(in srgb,var(--mark) 19%,var(--paper));stroke:var(--ink);stroke-width:2.2}
#fused-skirt svg .blue{fill:none;stroke:var(--mark);stroke-width:3.4}
#fused-skirt svg .ghost{fill:none;stroke:var(--ink);stroke-width:1.7;stroke-dasharray:7 6;opacity:.55}
#fused-skirt svg .blank{fill:none;stroke:none}
#fused-skirt svg .dot{fill:var(--mark);stroke:var(--paper);stroke-width:1.8}
#fused-skirt .trace{stroke-dasharray:1;animation:skirt-number-trace 820ms ease both;animation-delay:var(--wait,0ms)}
#fused-skirt .rise{animation:skirt-number-rise 650ms ease both;animation-delay:var(--wait,0ms)}
@keyframes skirt-number-trace{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes skirt-number-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#fused-skirt .trace,#fused-skirt .rise{animation:none}}

#fused-skirt {
  --accent-ink:var(--mark);
  --soft:color-mix(in srgb,var(--mark) 13%,var(--paper));
  --cloth:color-mix(in srgb,var(--mark) 31%,var(--paper));
  --rule:color-mix(in srgb,var(--ink) 16%,var(--paper));
}
#fused-skirt [hidden] {display:none !important}
#fused-skirt [data-substeps],#fused-skirt [data-selectors] {display:flex;flex-wrap:wrap;gap:6px 10px}
#fused-skirt [data-substeps]{padding-bottom:4px;border-bottom:1px solid var(--rule)}
#fused-skirt [data-scene] svg{max-width:820px;margin-inline:auto}
#fused-skirt .still .rise,#fused-skirt .still .trace{animation:none}
#fused-skirt [data-help] summary{cursor:pointer}
#fused-skirt [data-help] p{margin-top:6px;max-width:65ch}
#fused-skirt .page-actions {display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#fused-skirt .page-actions [data-progress]{margin-inline-start:auto}
#fused-skirt [data-quiz] summary{cursor:pointer}
#fused-skirt [data-check]{margin-top:10px;display:grid;gap:5px}
#fused-skirt [data-check] div{display:flex;gap:6px;flex-wrap:wrap}
#fused-skirt [data-feedback]:empty{display:none}
</style>

<section id="fused-skirt" aria-label="A 字裙打版全流程">
  <nav data-chapters aria-label="章节"></nav>
  <nav data-substeps aria-label="本章步骤" hidden></nav>
  <div data-selectors hidden>
    <nav data-people aria-label="示例尺寸" hidden>
      <button class="btn" type="button">原来的尺寸</button>
      <button class="btn" type="button">换一个人</button>
    </nav>
    <nav data-panels aria-label="选择半片" hidden>
      <button class="btn" type="button">半前片</button>
      <button class="btn" type="button">半后片</button>
    </nav>
  </div>
  <div aria-live="polite">
    <h2 data-title>准备工具</h2>
    <p data-caption></p>
    <p data-start-hint>点「下一步」看动画，展开「怎么做 · 为什么」跟画。</p>
  </div>
  <div data-scene></div>
  <div class="page-actions" aria-label="播放和翻页">
    <button class="btn" type="button" data-back>上一步</button>
    <button class="btn" type="button" data-replay>重播</button>
    <button class="btn btn-primary" type="button" data-next>下一步</button>
    <span data-progress aria-label="当前步数"></span>
  </div>
  <details data-help>
    <summary>怎么做 · 为什么</summary>
    <p data-note></p>
  </details>
  <details data-quiz hidden>
    <summary>小自测</summary>
    <section data-check aria-label="收量">
      <p>收腰 6.5，两个省各 2，侧缝收多少？</p>
      <div>
        <button class="btn" type="button" data-choice data-explanation="还要减掉另一个省。">4.5</button>
        <button class="btn" type="button" data-choice data-answer data-explanation="6.5－2－2＝2.5 厘米。">2.5</button>
      </div>
      <p data-feedback aria-live="polite"></p>
    </section>
    <section data-check aria-label="前片折边">
      <p>前中折边剪开吗？</p>
      <div>
        <button class="btn" type="button" data-choice data-answer data-explanation="展开后得到一整张前片。">保留</button>
        <button class="btn" type="button" data-choice data-explanation="回想前片展开后应有几片。">剪开</button>
      </div>
      <p data-feedback aria-live="polite"></p>
    </section>
  </details>
</section>

const numbers = (() => {
  const examples = [
    {length:60,depth:20,hips:[48,48],waists:[36,36],hipEase:[2,2],waistEase:[1,1],dart:[2,2],places:[[7,14.5],[7,14.5]]},

  const sum = (items) => items.reduce((a,b)=>a+b,0);
  const fmt = (n) => Number(n.toFixed(2));
  const path = (d, kind='line', traits='') => `<path d="${d}" class="${kind}" ${traits}/>`;

  const rise = (body,wait=0) => `<g class="rise" style="--wait:${wait}ms">${body}</g>`;

    calculation(3,{note:(d)=>d.index===0?'25－18.5＝6.5。先给两个省各分 2，侧缝收剩下的 2.5。这是试画分配。':'前片收 7，后片收 8。这个例子先给前省各 2、后省各 2.5，算出前后侧腰各收 3。其他体型可以有不同的分法。'}),
    calculation(4,{note:(d)=>d.index===0?'沿未合省的腰线 22.5 厘米找三等分点 7.5 和 15。原练习取 7 和 14.5，各向中线靠 0.5。省位最后由身体曲线和试穿决定。':'前腰线 23.5，参考三等分点，试画 8、16。后腰线 26.5，试画 9、18。都从各自的中线量。'})
  ]},
  {name:'画原型',steps:drafting.names.map((name,i)=>({
    title:name, person:true, panel:true,
    caption:(d)=>{
      const p=d.panels[panel];
      if(i===0)return `用尺从腰点垂直往下画 ${d.length} 厘米。`;
      if(i===1)return `向右画 ${p.hip} 厘米的框。从腰点向下 ${d.depth} 厘米画臀线。`;
      if(i===2)return `右上角向中线退 ${p.side} 厘米，顺着弧线接到侧臀点。`;
      return `两个省中心距中线 ${p.places.join('、')} 厘米，各宽 ${p.dart} 厘米。`;
    },
    note:[
      '原型是一张合身的基础纸样，以后可以拿它改新款。这条竖线是裙子正前方或正后方的中线。先画半前片，再用另一张纸画半后片。',
      '矩形左边是中线，右边是侧缝的起稿参考线。腰线与臀线都垂直于中线。',
      '臀线以下保留直线。画好两个半片后检查侧缝相接的长度和臀线记号。',
      '在每个省中心左右各量半个省宽作省脚。前片省长试画 9、12 厘米，后片各 14 厘米。沿省中心折纸，让两个省脚对齐。在折好的纸上顺画一条没有拐角的腰线，再展开。下一章会做试穿件。'
    ][i],
    picture:(data)=>numbers.shell(drafting.alts[i],drafting.scene(data.panels[panel],data,panel===1,i),'0 0 640 425')
  }))},
  {name:'改成新款',steps:[
    {
      title:'缝省，试原型',sub:'试原型',
      caption:'样衣是用样布做的试穿件。先缝省，再临时缝起前后片。',
      note:'描下两张原型的缝线，在要缝合的边外多留布，例如 1.5 厘米，这圈额外的布叫缝份。前片贴布折边剪一整片，后片剪左右各一片。把每个省的两边对齐，从腰线缝到尖。把前后布片将来朝外的面贴在一起，沿两侧缝线和后中开口以下，用大针脚临时缝合。试穿时用别针合上开口，检查腰口是否勒、臀线是否水平、侧缝是否垂直。',
      picture:zero.sample
    },
    base(3,{
      title:'转省放摆',pivot:true,
      caption:'沿线剪到省尖旁，留一点纸作转轴。合拢靠侧缝的省，裙摆就张开。',
      note:'先描出试穿过的原型。沿外侧省腿和省尖到下摆的直线剪开，尖端留一点纸。转动、补纸、贴牢，再顺修腰线和下摆。前后片都做。图演示同一转动原理。'
    })
  ]},
  {name:'试穿与裁片',steps:[
    base(4,{sub:'试样衣',title:'试样衣',caption:'用近似面料做样衣，站、坐、走。再把别针位置转回纸样。',note:'看腰口松紧、臀线是否水平、侧缝是否垂直。例子里腰口偏松，先用别针夹出合适的侧缝。量原缝线到别针线的距离，在纸样对应位置向内移相同距离，再顺接到原线。前后分别记录，改完核对两条侧缝再试穿。'}),
    calculation(5,{sub:'移动收量',title:'移动收量',caption:'也可以把侧腰的收量移给腰省，让腰围总量保持一样。',note:'如果侧腰太紧、附近腰口却空，可先还给侧缝 0.5，再在附近腰省多收 0.5。腰围整体偏松时，才减少腰围总量。两种改法都要复试。'}),
    base(5,{title:'标记裁片',caption:'沿虚线缝、沿外边裁。布纹箭头顺布边，短记号帮助两片对齐。',note:'合省后核对前后侧缝的缝线长度和臀线剪口。然后加缝份、下摆折量、布纹线及剪口。前片沿前中对折裁一片，后片镜像裁两片，后中留拉链。腰头是缝在裙腰上的布带。沿修正后的腰口量取腰头长度，另留扣合时重叠的一段和缝份。'}),
    {
      title:'把纸样排在布上',sub:'看裁布',
      caption:'前中贴折边，剪完展开成一整片。后片左右各裁一片。',
      note:'让纸样箭头与布的织边平行。织边是布卷两侧原本织好的长边。前中折边保留，不从中间剪开。后中有接缝和拉链，要沿裁边剪开。两张后裁片像左右手一样互为镜像。',
      picture:zero.layout
    }
  ]}
];

function makeButton(text, callback){
  const button=document.createElement('button');
  button.type='button';
  button.className='btn';
  button.textContent=text;
  button.addEventListener('click',callback);
  return button;
}
const pages=lesson.flatMap((chapter,chapterIndex)=>chapter.steps.map(step=>({step,chapterIndex})));
const chapterButtons=lesson.map((chapter,i)=>{
  const target=pages.findIndex(item=>item.chapterIndex===i);
  const button=makeButton(`${i+1} ${chapter.name}`,()=>show(target));
  nav.append(button);
  return button;
});

function runPivot(play) {
  const wing=scene.querySelector('[data-wing]');
  const opening=scene.querySelector('[data-opening]');
  const endAngle=-2*Math.atan2(6,72);
  function setAngle(value) {
    const x=87-288*Math.sin(value);
    const y=72+288*Math.cos(value);
    wing.setAttribute('transform',`rotate(${value*180/Math.PI} 87 72)`);
    opening.setAttribute('d',`M87 72V360L${x} ${y}Z`);
  }
  if(!play || reduced.matches){setAngle(endAngle);return;}
  const started=performance.now();
  function tick(now){
    const t=Math.min(1,Math.max(0,(now-started-220)/830));
    setAngle(endAngle*t*t*(3-2*t));
    if(t<1)frame=requestAnimationFrame(tick);
  }
  frame=requestAnimationFrame(tick);
}

function show(i,play=true,restoreSubstepFocus=false) {
  cancelAnimationFrame(frame);
  const pageChanged=page!==i;
  page=i;
  const {step,chapterIndex}=pages[i];
  const data=numbers.getData(person);
  const toText=(value)=>typeof value==='function'?value(data):value;
  chapterButtons.forEach((button,j)=>button.setAttribute('aria-pressed',String(j===chapterIndex)));
  const sectionPages=pages.map((entry,index)=>({...entry,index})).filter(entry=>entry.chapterIndex===chapterIndex);
  details.hidden=sectionPages.length===1;
  details.replaceChildren();
  if(!details.hidden) sectionPages.forEach(entry=>{
    const button=makeButton(entry.step.sub||entry.step.title,()=>show(entry.index,true,true));
    button.setAttribute('aria-pressed',String(entry.index===page));
    details.append(button);
    if(restoreSubstepFocus && entry.index===page)button.focus({preventScroll:true});
  });
  selectors.hidden=!step.person && !step.panel;
  root.querySelector('[data-people]').hidden=!step.person;
  root.querySelector('[data-panels]').hidden=!step.panel;
  people.forEach((button,j)=>button.setAttribute('aria-pressed',String(j===person)));
  panels.forEach((button,j)=>button.setAttribute('aria-pressed',String(j===panel)));
  title.textContent=step.title;
  caption.textContent=toText(step.caption)||'';
  note.textContent=toText(step.note)||'';
  help.hidden=!step.note;
  if(pageChanged)help.open=false;
  root.querySelector('[data-progress]').textContent=`${i+1}／${pages.length}`;
  next.textContent=i===pages.length-1?'回到开头':'下一步';
  back.disabled=i===0;
  scene.classList.toggle('playing',play&&!reduced.matches);
  scene.classList.toggle('still',!play||reduced.matches);
  scene.innerHTML=step.picture(data);
  const hint = root.querySelector('[data-start-hint]');
  hint.hidden = i !== 0;
  root.querySelector('[data-quiz]').hidden = i !== pages.length-1;
  if(step.pivot)runPivot(play);
}

people.forEach((button,i)=>button.addEventListener('click',()=>{person=i;show(page)}));
panels.forEach((button,i)=>button.addEventListener('click',()=>{panel=i;show(page)}));
back.addEventListener('click',()=>show(Math.max(0,page-1)));
next.addEventListener('click',()=>show((page+1)%pages.length));
replay.addEventListener('click',()=>show(page));
reduced.addEventListener('change',()=>show(page,false));
root.querySelectorAll('[data-check]').forEach((group)=>{
  const answer=group.querySelector('[data-answer]');
  const feedback=group.querySelector('[data-feedback]');
  group.addEventListener('click',(event)=>{
    const choice=event.target.closest('button[data-choice]');
    if(!choice)return;
    const correct=choice===answer;
    feedback.textContent=(correct?'答对了。':'再试一下。')+(correct?answer.dataset.explanation:choice.dataset.explanation);
  });
});
show(0,false);

})();
