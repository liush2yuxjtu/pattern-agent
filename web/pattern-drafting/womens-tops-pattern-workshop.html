<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; img-src data:; font-src data:; media-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>女式上衣打版｜T 恤与衬衣</title>
<style>
:root{color-scheme:light dark;--background:#f4efe4;--foreground:#24342e;--card:#fffcf5;--green:#216a61;--orange:#934635}
@media(prefers-color-scheme:dark){:root{--background:#202825;--foreground:#f1efe3;--card:#2a342f;--green:#a0dfca;--orange:#f7a98c}}
*{box-sizing:border-box}
body{margin:0;background:var(--background);color:var(--foreground);font:16px/1.55 system-ui,sans-serif}
main{width:min(100% - 28px,940px);margin:27px auto 45px}
header{padding:13px 0 18px;border-top:3px solid var(--foreground)}
h1{margin:0;font-size:clamp(29px,5.3vw,56px);line-height:1.02;letter-spacing:-.04em}
header p{margin:9px 0 0}
#tops-workshop h2{font-size:clamp(24px,3.4vw,34px);line-height:1.22}
#tops-workshop [data-art]{background:var(--card);border-radius:9px;padding:6px}
.btn{font:inherit;color:var(--foreground);background:var(--card);border:1px solid color-mix(in srgb,var(--foreground) 25%,var(--card));border-radius:7px;padding:7px 11px;min-height:44px;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--background);border-color:var(--accent)}
.btn-primary{background:var(--foreground);color:var(--background)}
.btn:disabled{opacity:.44;cursor:default}
:focus-visible{outline:3px solid var(--green);outline-offset:3px}
main>details{margin-top:18px;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--foreground) 20%,var(--background))}
a{color:var(--green)}
@media(max-width:380px){.btn{padding-inline:9px}}
</style>
</head>
<body>
<main>
<header><h1>女式上衣，从零打版</h1><p>选一款，点「下一步」跟画。 <a href="womens-tops-interactive-drafting.html">在白纸上动手画</a></p></header>
<style>
#tops-workshop {
  --paper:var(--background,#fbf8ef);
  --ink:var(--foreground,#222c28);
  --accent:var(--green,#216a61);
  --rule:color-mix(in srgb,var(--ink) 17%,var(--paper));
  min-width:0;color:var(--ink);display:grid;gap:12px;
}
#tops-workshop[data-family="shirt"]{--accent:var(--orange,#9a4638)}
#tops-workshop [hidden]{display:none !important}
#tops-workshop [data-paper] button{margin-inline-end:2px}
#tops-workshop h2,#tops-workshop p{margin:0}
#tops-workshop .style-row{display:grid;grid-template-columns:7em 1fr;align-items:center;gap:8px;margin-bottom:7px}
#tops-workshop .style-options,#tops-workshop [data-lessons],#tops-workshop [data-draft-tabs],#tops-workshop [data-paper],#tops-workshop .controls{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
#tops-workshop [data-lessons]{border-top:1px solid var(--rule);padding-top:10px}
#tops-workshop [data-view-name]{color:var(--accent);font-weight:600}
#tops-workshop [data-art]{min-width:0}
#tops-workshop svg{display:block;width:100%;height:auto;max-width:850px;margin-inline:auto}
#tops-workshop svg text{fill:var(--ink);font:500 27px system-ui,sans-serif}
#tops-workshop svg text.small{font-size:25.5px}
#tops-workshop svg text.value{font-size:30px;font-weight:650}
#tops-workshop svg .line{fill:none;stroke:var(--ink);stroke-width:2.5}
#tops-workshop svg .paper{fill:var(--paper);stroke:var(--ink);stroke-width:2.6}
#tops-workshop svg .fill{fill:color-mix(in srgb,var(--accent) 22%,var(--paper));stroke:var(--ink);stroke-width:2.6}
#tops-workshop svg .added{fill:var(--accent);stroke:var(--ink);stroke-width:1.8}
#tops-workshop svg .ghost{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-dasharray:6 5;opacity:.52}
#tops-workshop svg .alert{fill:none;stroke:var(--accent);stroke-width:3.5}
#tops-workshop svg .point{fill:var(--accent);stroke:var(--paper);stroke-width:1.6}
#tops-workshop svg .arrowhead{fill:none;stroke:var(--accent);stroke-width:1.8}
#tops-workshop svg .gridline{stroke:var(--rule);fill:none;opacity:.55}
#tops-workshop .animated .trace{stroke-dasharray:1;animation:tops-trace 900ms ease both;animation-delay:var(--delay,0ms)}
#tops-workshop .animated .appear{animation:tops-appear 500ms ease both;animation-delay:var(--delay,0ms)}
@keyframes tops-trace{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes tops-appear{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
#tops-workshop .progress-line{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
#tops-workshop progress{width:min(13vw,85px);height:8px;accent-color:var(--accent)}
#tops-workshop details p{margin-top:8px;max-width:70ch}
#tops-workshop summary{cursor:pointer}
@media(max-width:540px){#tops-workshop .style-row{grid-template-columns:1fr;gap:4px}}
@media(prefers-reduced-motion:reduce){#tops-workshop .animated .trace,#tops-workshop .animated .appear{animation:none}}
</style>
<section id="tops-workshop" aria-label="女式 T 恤与衬衣打版教程">
  <nav data-styles aria-label="八个子页"></nav>
  <nav data-lessons aria-label="本款步骤"></nav>
  <nav data-draft-tabs aria-label="本步落笔顺序" hidden></nav>
  <div data-paper aria-label="半片选择" hidden>
    <button class="btn" type="button" data-side="0">半前片</button>
    <button class="btn" type="button" data-side="1">半后片</button>
  </div>
  <div aria-live="polite">
    <p data-view-name></p>
    <h2 data-heading>定款</h2>
    <p data-caption></p>
  </div>
  <div data-art></div>
  <div class="controls">
    <button class="btn" type="button" data-prev>上一步</button>
    <button class="btn" type="button" data-replay>重播</button>
    <button class="btn btn-primary" type="button" data-next>下一步</button>
    <div class="progress-line"><progress max="9" value="1" data-progress aria-label="本款进度"></progress><span data-status></span></div>
  </div>
  <details data-detail>
    <summary>怎么做 · 为什么</summary>
    <p data-note></p>
  </details>
</section>

<script>
(() => {
const body = {
  chest:[46,42], waist:[36,36], hip:[48,48],
  shoulders:38, arm:28, neck:35, wrist:16, bustHeight:26, bustSpan:18,
  shoulderToWaist:40, shoulderToHip:60, shoulderToWrist:56
};
const styles = {
  tee:[
    {id:'loose',name:'宽松',summary:'胸腰留空间，轻落肩，短袖自然垂。',ease:[14,28,12],drop:2,bodyLength:63,sleeve:19,armEase:9,neck:[8,8,2.5],fit:'抬臂时看看衣身会不会被腋下带起来。',fix:'侧缝后移或前移，先核查前后胸宽和袖子有没有装反。下摆上提时同时检查袖窿深度和袖身宽度。'},
    {id:'classic',name:'合身',summary:'肩缝靠近肩点，胸腰有少量活动空间。',ease:[8,16,8],drop:0,bodyLength:60,sleeve:17,armEase:6,neck:[7.5,7.5,2.5],fit:'肩缝贴近肩点。抱臂时胸前和袖口都要能动。',fix:'胸前横向拉纹先解开侧缝，在拉紧的位置加量。如果放开侧缝后前摆仍高，再查前衣长和胸部立体量。'},
    {id:'slim',name:'修身',summary:'腰线更明显，选有弹性且能回弹的针织。',ease:[2,6,4],drop:0,bodyLength:60,sleeve:16,armEase:3,neck:[7,7.5,2.5],fit:'先试套头，再坐下、抱臂。腰贴近身体，布料仍要回弹。',fix:'如果套头困难，先检查领口周长和领条弹性。如果胸腰勒住，按位置加量。换低弹面料时重新试版。'},
    {id:'oversize',name:'超宽松',summary:'明显落肩、宽袖和较长衣身，刻意放大轮廓。',ease:[28,44,26],drop:5,bodyLength:69,sleeve:23,armEase:13,neck:[8.5,8,2.5],fit:'落肩是款式。抬手和伸手时，袖窿仍要允许手臂活动。',fix:'整件随手臂抬起时，先查腋下是否挖得过低，以及袖宽是否足够。用样衣判断抬高腋点会不会改善活动。'}
  ],
  shirt:[
    {id:'loose',name:'宽松',summary:'轻落肩、直身，门襟扣好后仍有活动空间。',ease:[16,30,16],drop:2,bodyLength:66,sleeve:54,armEase:12,neck:[7.5,7,2.5],dart:'侧胸省按试穿决定',waistDart:0,fit:'扣好前门襟，坐下、前伸双臂，后背应有余量。',fix:'前伸就绷紧，查后背宽和袖窿。保留宽松轮廓，先检查卡住的是哪一段缝。'},
    {id:'classic',name:'合身',summary:'肩点清楚，胸省容纳胸部，侧缝轻收腰。',ease:[10,18,10],drop:0,bodyLength:63,sleeve:56,armEase:9,neck:[7.5,7,2.5],dart:'示例加侧胸省',waistDart:0,fit:'扣好门襟，检查胸口有没有张开，侧缝应接近垂直。',fix:'如果门襟在胸点附近张开，先查前胸宽和前长，再调胸省。确认活动空间后，复核胸高附近的扣位。'},
    {id:'slim',name:'修身',summary:'胸省营造立体量，腰省令腰部更贴合。',ease:[6,10,8],drop:0,bodyLength:61,sleeve:56,armEase:7,neck:[7.5,7,2.5],dart:'侧胸省＋前后腰省',waistDart:1.5,fit:'扣好扣子再坐下、抱臂，胸口和腰口都应有活动空间。',fix:'胸口张开，优先查前胸宽和前长。腰太紧，可减小腰省或放开腰节侧缝，再重新核对前后侧缝。'},
    {id:'oversize',name:'超宽松',summary:'明显落肩和宽袖，衣身加长，保留翻领和门襟。',ease:[30,48,30],drop:6,bodyLength:73,sleeve:50,armEase:14,neck:[8,7.5,2.5],dart:'示例用直身，胸省按体型决定',waistDart:0,fit:'试袖口能否落在手腕附近，再检查深袖窿是否妨碍伸手。',fix:'伸手带起整件衣服时，先配对检查袖窿和袖山。侧缝够宽也可能需要抬高腋点。落肩后要重测袖长。'}
  ]
};
const families={
  tee:{name:'女式 T 恤',tab:'T 恤',cloth:'针织',color:'#216a61',wash:'先试拉布再放开。修身款尤其看布能否弹回原长。'},
  shirt:{name:'女式衬衣',tab:'衬衣',cloth:'梭织',color:'#9a4638',wash:'先用相近的梭织布试版。领、领座和袖口可按面料配衬。'}
};
const pairs = [body.chest,body.waist,body.hip];
const sum = xs => xs.reduce((a,b)=>a+b,0);
const calc = (family,index)=>{
  const s=styles[family][index];
  return {...s,family,isShirt:family==='shirt',meta:families[family],
    rows:pairs.map((part,i)=>({name:['胸围','腰围','臀围'][i],body:sum(part),ease:s.ease[i],finished:sum(part)+s.ease[i],
      halves:part.map(n=>(n+s.ease[i]/2)/2)})),
    shoulder:body.shoulders+2*s.drop,arm:body.arm+s.armEase};
};

const svg = (() => {
  const path=(d,c='line',attr='')=>`<path d="${d}" class="${c}" ${attr}/>`;
  const text=(x,y,t,c='',anchor='middle')=>`<text x="${x}" y="${y}" class="${c}" text-anchor="${anchor}">${t}</text>`;
  const dot=(x,y)=>`<circle cx="${x}" cy="${y}" r="4.4" class="point"/>`;
  const trace=(d,ms=0)=>path(d,'alert trace',`pathLength="1" style="--delay:${ms}ms"`);
  const rise=(art,ms=0)=>`<g class="appear" style="--delay:${ms}ms">${art}</g>`;
  const group=(x,y,art,scale=1)=>`<g transform="translate(${x} ${y}) scale(${scale})">${art}</g>`;
  const arrow=(d,both=false)=>path(d,'alert',`marker-end="url(#top-tip)" ${both?'marker-start="url(#top-tip)"':''}`);
  const grid='<rect x="12" y="10" width="616" height="380" rx="8" fill="url(#top-grid)"/>';
  const shell=(art,alt)=>`<svg viewBox="0 0 640 400" role="img" aria-label="${alt}" stroke-linecap="round" stroke-linejoin="round">
    <defs>
      <marker id="top-tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="arrowhead" d="M2 1L8 5L2 9"/></marker>
      <pattern id="top-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" class="gridline"/></pattern>
    </defs>${art}</svg>`;
  function flat(s,rear=false){
    const [c,w,h]=s.rows.map(r=>r.halves[rear?1:0]*2.62);
    const sd=s.shoulder*1.31, drop=s.drop;
    const baseY=110+drop*2, hem=180+s.bodyLength*.9;
    const sleeveEnd=sd+(s.isShirt?48:Math.round(s.sleeve*2.45));
    const sy=s.isShirt?220+drop*2:96+s.sleeve*1.7;
    const near=s.isShirt?c+21:c+12;
    const neck=s.neck[0]*2.15, neckDeep=(rear?s.neck[2]:s.neck[1])*2.15;
    const left=`L${-sd} ${32+drop*2}L${-sleeveEnd} ${sy-15}L${-near} ${sy}L${-c} ${baseY}Q${-w} 145 ${-w} 173L${-h} ${hem}`;
    const right=`L${h} ${hem}L${w} 173Q${w} 145 ${c} ${baseY}L${near} ${sy}L${sleeveEnd} ${sy-15}L${sd} ${32+drop*2}L${neck} 15`;
    let drawing=path(`M${-neck} 15${left}Q0 ${hem+8} ${h} ${hem}${right}Q0 ${15+neckDeep*2} ${-neck} 15Z`,'fill');
    drawing+=path(`M${-sd} ${34+drop*2}Q${-sd+10} 79 ${-c} ${baseY}M${sd} ${34+drop*2}Q${sd-10} 79 ${c} ${baseY}`,'line');
    if(!s.isShirt){
      drawing+=path(`M${-neck-5} 18Q0 ${22+neckDeep*2} ${neck+5} 18`,'line');
      drawing+=path(`M${-h+2} ${hem-7}Q0 ${hem+1} ${h-2} ${hem-7}`,'ghost');
    } else if(rear){
      drawing+=path(`M${-sd+6} ${55+drop*2}Q0 ${75+drop} ${sd-6} ${55+drop*2}`,'line');
      if(s.waistDart) drawing+=path('M-25 135l-6 42 6 49 6 -49ZM25 135l-6 42 6 49 6 -49Z','ghost');
    } else {
      drawing+=path(`M-20 14L-7 8Q0 14 7 8L20 14L30 38L10 53L0 34L-10 53L-30 38Z`,'paper');
      drawing+=path(`M-6 37V${hem+2}M6 37V${hem+2}`,'line');
      drawing+=Array.from({length:6},(_,i)=>dot(0,65+i*32)).join('');
      drawing+=path(`M${-sleeveEnd+6} ${sy-24}L${-near-4} ${sy-7}M${sleeveEnd-6} ${sy-24}L${near+4} ${sy-7}`,'line');
      if(s.id==='classic'||s.id==='slim') drawing+=path(`M${-c+1} 121L-35 119L${-c+1} 132M${c-1} 121L35 119L${c-1} 132`,'ghost');
      if(s.waistDart) drawing+=path('M-24 140l-5 37 5 45 5 -45ZM24 140l-5 37 5 45 5 -45Z','ghost');
    }
    return drawing;
  }
  function sketch(s){
    const neck=s.isShirt?'翻领 · 前开扣':'圆领 · 套头';
    return shell(grid+group(166,75,flat(s),.93)+group(474,75,flat(s,true),.93)
      +text(165,55,'正面')+text(476,55,'背面')
      +rise(text(320,382,neck,'small'),600),`${s.meta.name}${s.name}款的正面和背面平面款式示意。${s.summary}`);
  }
  function measure(s){
    const bust=sum(body.chest), waist=sum(body.waist), hip=sum(body.hip);
    const figure='M276 34Q255 68 220 72Q212 91 229 117Q251 140 243 162Q223 214 237 252L258 351H286L301 268L316 351H344L365 252Q379 214 359 162Q351 140 373 117Q390 91 382 72Q347 68 326 34';
    return shell(path(figure,'fill')+
      trace('M237 123q64 25 128 0',0)+trace('M244 164q57 18 114 0',240)+trace('M235 225q66 26 132 0',460)
      +text(122,126,`胸围 ${bust}`)+text(122,170,`腰围 ${waist}`)+text(122,235,`臀围 ${hip}`)
      +arrow('M233 84H369',true)+text(301,59,`肩宽 ${body.shoulders}`,'small')
      +path('M365 126H442M359 165H442M368 228H442','ghost')
      +text(514,104,s.isShirt?`领围 ${body.neck}`:`上臂 ${body.arm}`)
      +text(514,158,s.isShirt?`腕围 ${body.wrist}`:`肩颈到胸点 ${body.bustHeight}`,'small')
      +text(514,211,s.isShirt?`上臂 ${body.arm}`:`胸点间距 ${body.bustSpan}`,'small')
      +arrow('M405 77V285',true)+text(500,303,`款式衣长 ${s.bodyLength}`,'small')+text(500,342,'厘米','small'),
      '以同一人体示例量胸、腰、臀、肩和上臂。需要定位胸点时量肩颈点到胸点及两胸点距离。衣长按款式选。');
  }
  function ease(s){
    const baseline=107, unit=2.6;
    return shell(text(215,35,'净尺寸 ＋ 余量 ＝ 成衣','small')+text(515,35,'厘米','small')
      +s.rows.map((r,i)=>{
        const y=88+105*i, x0=baseline, x1=x0+r.body*unit, x2=x1+r.ease*unit;
        return text(56,y+8,r.name,'small')
          +path(`M${x0} ${y-10}H${x1}v22H${x0}Z`,'fill')
          +rise(path(`M${x1} ${y-10}H${x2}v22H${x1}Z`,'added'),i*180+220)
          +rise(text(517,y+9,`${r.body}＋${r.ease}＝${r.finished}`,'value'),i*180+340)
          +text(280,y+56,`半前 ${r.halves[0]}　半后 ${r.halves[1]}`,'small');
      }).join(''),
      '胸腰臀的净尺寸加松量成为成衣围度。前后身净尺寸各加一半松量，再除以二，得到左或右半片的成品缝线宽。');
  }
  function block(s){
    const lineYs=[165,235,320];
    return shell(grid + [0,1].map((i)=>{
      const x=62+i*302;
      const [c,w,h]=s.rows.map(r=>x+r.halves[i]*6.2);
      const wc=w+(s.waistDart||0)*6.2;
      const nx=x+s.neck[0]*6.2, end=x+s.shoulder*3.1;
      const head=66+(i?s.neck[2]:s.neck[1])*4.1;
      const curveY=76+Math.min(20,s.drop*2);
      const profile=`M${x} ${head}Q${nx-15} ${head} ${nx} 49L${end} ${curveY}Q${end-17} 104 ${c} 136L${c} 165C${c} 184 ${wc} 201 ${wc} 235Q${wc} 272 ${h} 320L${h} 347Q${x+72} 363 ${x} 351Z`;
      const center=`M${x} 48V352`;
      const a=text(x+93,35,i?'半后片':'半前片');
      const guides=[c,w,h].map((r,j)=>path(`M${x} ${lineYs[j]}H${Math.max(r,j===1?wc:r)}`,'ghost')
        +text(x+22,lineYs[j]-8,['胸','腰','臀'][j],'small')
        +text((x+r)/2+13,lineYs[j]+26,s.rows[j].halves[i],'small')).join('');
      const darts=s.waistDart?trace(`M${x+62} 174L${x+57} 235L${x+62} 290L${x+67} 235Z`,820):'';
      const bustDart=s.isShirt&&!i&&(s.id==='classic'||s.id==='slim')?
        rise(path(`M${c-4} 166L${x+82} 160L${c-5} 177`,'alert')+dot(x+63,158),1000):'';
      const placket=s.isShirt&&!i?rise(path(`M${x-16} ${head+2}V353M${x-7} ${head+1}V353`,'alert'),1000):'';
      return a+path(profile,'paper')+path(center,'ghost')+guides+
        trace(`M${x} ${head}Q${nx-15} ${head} ${nx} 49L${end} ${curveY}Q${end-17} 104 ${c} 136`,180)
        +trace(`M${c} 136V165C${c} 184 ${wc} 201 ${wc} 235Q${wc} 272 ${h} 320`,450)
        +darts+bustDart+placket+(s.waistDart?text(x+98,386,'腰线先含省量','small'):'');
    }).join(''),`画${s.meta.name}半前和半后片。标出中线及胸、腰、臀横线，再画领口、肩线、袖窿、侧缝。标注是合省后的有效宽度。`);
  }
  function sleeve(s){
    const L = 196 - (s.arm-31)*2;
    const R = 444 + (s.arm-31)*2;
    const shoulderY = 62 + s.drop*5;
    const underarmY = 187;
    const lower = 290 + Math.min(52,s.sleeve);
    const bottomWidth = s.isShirt ? 51 : (R-L)*.43;

function button(label,onClick,className='btn'){
  const node=document.createElement('button');
  node.type='button';
  node.className=className;
  node.textContent=label;
  node.addEventListener('click',onClick);
  return node;
}

for(const family of Object.keys(styles)){
  const row=document.createElement('div');
  row.className='style-row';
  const groupTitle=document.createElement('p');
  groupTitle.textContent=families[family].name;
  row.append(groupTitle);
  const options=document.createElement('div');
  options.className='style-options';
  options.setAttribute('role','group');
  options.setAttribute('aria-label',families[family].name);
  styles[family].forEach((s,i)=>{
    const choice=button(s.name,()=>go(family,i,0));
    choice.setAttribute('aria-label',`${families[family].name} · ${s.name}`);
    options.append(choice);
    styleButtons.push({family,index:i,choice});
  });
  row.append(options);
  chooser.append(row);
}
steps.forEach((s,i)=>{
  const control = button(s.name,()=>go(current.family,current.index,i));
  lessonButtons.push(control);
  tabs.append(control);
});

function fromHash(){
  const [family,slug,page,sub,part]=location.hash.slice(1).split('/');
  if(!Object.hasOwn(styles,family))return {family:'tee',index:0,step:0,plate:0,side:0};
  const index=styles[family].findIndex(s=>s.id===slug);
  const pageIndex=Number(page)-1;
  const step=Number.isInteger(pageIndex)&&pageIndex>=0&&pageIndex<steps.length?pageIndex:0;
  const n=Number(sub)-1;
  return {family,index:Math.max(0,index),step,plate:Number.isInteger(n)&&n>=0&&n<draft.count(step)?n:0,side:part==='back'?1:0};
}

function render(state,animate){
  const old=current;
  current=state;
  const {family,index,step,plate,side}=state;
  const s=calc(family,index);
  const lesson=steps[step];
  const pages=draft.names(step);
  const drawing=pages.length?draft.screen(s,step,plate,side):null;
  const subnavChanged=old.step!==step || draftTabs.children.length!==pages.length;
  draftTabs.hidden=!pages.length;
  paper.hidden=step!==3;
  if(subnavChanged){
    draftTabs.replaceChildren(...pages.map((title,i)=>button(title,()=>go(current.family,current.index,current.step,i,current.side))));
  }
  [...draftTabs.children].forEach((node,i)=>node.setAttribute('aria-pressed',String(i===plate)));
  sideButtons.forEach((node,i)=>node.setAttribute('aria-pressed',String(i===side)));
  if(old.family!==family||old.index!==index||old.step!==step)detail.open=Boolean(drawing);
  app.dataset.family=family;
  styleButtons.forEach(({family:f,index:i,choice})=>choice.setAttribute('aria-pressed',String(f===family&&i===index)));
  lessonButtons.forEach((control,i)=>control.setAttribute('aria-pressed',String(i===step)));
  viewName.textContent=`${s.meta.name} · ${s.name}`;
  heading.textContent=drawing?.title||lesson.name;
  caption.textContent=drawing?.cap||lesson.caption(s);
  note.textContent=drawing?.info||lesson.note(s);
  status.textContent=`${step+1}／${steps.length}`+(pages.length?` · ${plate+1}／${pages.length}`:'');
  progress.value=step+1;
  prev.disabled=step===0;
  next.textContent=step===steps.length-1?'回本款开头':'下一步';
  stage.classList.toggle('animated',animate&&!usedVisuals.matches);
  stage.innerHTML=drawing?.art||lesson.draw(s);
}
function go(family,index,step,plate=0,side=0){
  const newState={family,index,step,plate,side};
  if(['file:','http:','https:'].includes(location.protocol)){
    const hash=`#${family}/${styles[family][index].id}/${step+1}`+(plate||side?`/${plate+1}${side?'/back':''}`:'');
    if(location.hash!==hash)history.replaceState(null,'',hash);
  }
  render(newState,true);
}
prev.addEventListener('click',()=>{
  const {family,index,step,plate,side}=current;
  if(plate>0){go(family,index,step,plate-1,side);return;}
  if(step===3&&side===1){go(family,index,step,draft.count(step)-1,0);return;}
  const before=Math.max(0,step-1);
  go(family,index,before,draft.count(before)-1);
});
next.addEventListener('click',()=>{
  const {family,index,step,plate,side}=current;
  if(plate+1<draft.count(step)){go(family,index,step,plate+1,side);return;}
  if(step===3&&side===0){go(family,index,step,0,1);return;}
  go(family,index,(step+1)%steps.length);
});
sideButtons.forEach((node,i)=>node.addEventListener('click',()=>go(current.family,current.index,current.step,0,i)));
app.querySelector('[data-replay]').addEventListener('click',()=>render(current,true));
usedVisuals.addEventListener('change',()=>render(current,false));
window.addEventListener('hashchange',()=>render(fromHash(),false));
render(fromHash(),false);
if(draft.names(current.step).length)detail.open=true;

})();
</script>
