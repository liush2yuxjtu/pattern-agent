schema: intent-corpus/v1
interpretation: 根据公开反馈提出候选操作。每条都需核对尺码、实物量法和目标。
cases:
- id: intent-e01
  evidence:
    url: https://www.uniqlo.com/us/en/products/E451096-000/00/reviews
    locator: Too loose, wide, and long sleeves · 2023-01-12
    evidence: Petite XS buyer found the body and sleeves too wide and the sleeves
      too long, and explicitly asked for a petite XS.
  garment: Cotton Volume Long-Sleeve Blouse
  region: 变体
  candidate_request: Draft a petite variant with separate sleeve length and body-width
    targets.
  measurement_inputs: Finished sleeve length, flat chest and hem widths, shoulder
    position, and petite size block.
  preserve: Retain regular XS and sleeve volume as separate choices.
  target: null
  state: needs_confirmation
- id: intent-e02
  evidence:
    url: https://www.uniqlo.com/us/en/products/E457373-000/00/reviews
    locator: Cute with slightly short sleeves · 2023-04-06
    evidence: Buyer returned an otherwise well-fitting parka because the sleeves were
      a little short.
  garment: Reversible Parka
  region: 袖长
  candidate_request: Lengthen the lower sleeve with a tall option.
  measurement_inputs: Shoulder-to-cuff measurement, underarm length, cuff and lining
    construction.
  preserve: Keep sleeve cap and body size.
  target: null
  state: needs_confirmation
