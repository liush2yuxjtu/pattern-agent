    evidence: Maker could barely pull the short sleeve above the elbow and reported
      small armholes, while collar and yoke felt right.
  garment: Simon shirt
  region: 袖窿
  candidate_request: Check body landmarks and biceps ease before redrawing the front/back
    armhole and matching sleeve cap.
  measurement_inputs: Measured shoulder-to-shoulder, HPS-to-waist, biceps and seam-length
    matching targets.
  preserve: Keep collar and yoke unless root cause is found there.
  target: null
  state: needs_confirmation
