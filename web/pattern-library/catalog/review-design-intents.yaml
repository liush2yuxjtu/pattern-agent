  region: 上臂松量
  candidate_request: Test the sleeve-width response over multiple biceps input/ease
    settings.
  measurement_inputs: Version, size and expected signed relationship between ease
    and circumference.
  preserve: Seam lengths matched to the intended armscye and sleeve division.
  target: null
  state: needs_confirmation
