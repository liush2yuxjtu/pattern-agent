      裁片旋转时重新确认材料方向映射。'
    缩水口径:
      资料中的表达: 纸样尺寸 = 成衣尺寸 ×（1 + 方向缩水率）− 针织长度向下垂补偿。
      采用条件: '先明确该百分数是洗后尺寸变化、预定补偿率还是已批准的补偿系数。

        不能混用符号。'
      本文件洗后变化定义: '洗后尺寸变化率 =（洗后长度 − 洗前长度）÷ 洗前长度；收缩为负，

        伸长为正。'
      仅考虑一次缩水的换算: '在无下垂且忽略工艺耦合时，

        洗前所需长度 = 洗后目标长度 ÷（1 + 洗后尺寸变化率）。'
      补偿系数定义: '若采用已批准的补偿系数k，

        则纸样净尺寸 = 成衣目标尺寸 × k − 已批准的下垂补偿。

        记录每项的处理先后和依据。'
      挂牌数据处理: '候选甲的宽长向负5%继续保存为挂牌尺寸变化；未实测、未选料，

        不转成本款补偿值，也不重复放大已有几何。'
    针织下垂: 按实际悬垂试验、方向、受力和部位取值；不只凭克重查到一个通用补偿数。
