schema: intent-corpus/v1
interpretation: Candidate requests are hypotheses from source observations. Null targets require confirmation.
  Public amounts belong to their source garment and measurement context.
cases:
- id: intent-e01
  evidence:
    feedback_id: E01
    url: https://www.uniqlo.com/us/en/products/E451096-000/00/reviews
    locator: Too loose, wide, and long sleeves · 2023-01-12
    source_observation: Petite XS buyer found the body and sleeves too wide and the sleeves too long, and explicitly
      asked for a petite XS.
  garment: Cotton Volume Long-Sleeve Blouse
  region: sleeve and body
  candidate_request: Draft a petite variant with separate sleeve length and body-width targets.
  measurement_inputs: Finished sleeve length, flat chest and hem widths, shoulder position, and petite size
    block.
  preserve: Retain regular XS and sleeve volume as separate choices.
  target: null
  state: needs_confirmation
