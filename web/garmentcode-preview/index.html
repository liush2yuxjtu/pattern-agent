    canvas.addEventListener('pointerup',()=>{drag=null;save();});canvas.addEventListener('pointercancel',()=>{drag=null;});
    canvas.addEventListener('wheel',e=>{e.preventDefault();distance=Math.max(height*.4,Math.min(height*5,distance*Math.exp(e.deltaY*.001)));request();},{passive:false});
    root.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')yaw-=.12;else if(e.key==='ArrowRight')yaw+=.12;else if(e.key==='ArrowUp')pitch-=.12;else if(e.key==='ArrowDown')pitch+=.12;else return;e.preventDefault();request();save();});
    window.addEventListener('openai:set_globals',e=>{const s=e.detail&&e.detail.globals&&e.detail.globals.widgetState;if(s&&s.privateContent){if(Number.isFinite(s.privateContent.yaw))yaw=s.privateContent.yaw;if(Number.isFinite(s.privateContent.pitch))pitch=s.privateContent.pitch;request();}});
    el('source').textContent=data.name+' · '+data.source;
    new ResizeObserver(request).observe(canvas);
    new MutationObserver(request).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
    sync();
  })();
  </script>
