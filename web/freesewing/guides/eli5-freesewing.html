<body><main>
<header><small>FreeSewing</small><h1>先看一件上衣。</h1><p>纸样，就是剪布用的图。</p></header>

<section><h2><span class="num">01</span>人先选画法</h2><div class="choose"><button id="straight" data-kind="straight" aria-pressed="false"><span id="straight-picture"></span><b>直身</b><small>Brian</small></button><button id="fitted" data-kind="fitted" aria-pressed="true"><span id="fitted-picture"></span><b>收腰</b><small>Bibi</small></button></div></section>

<section><h2><span class="num">02</span>再量身体</h2><div class="panel measure"><svg viewBox="0 0 760 390" role="img" aria-label="给一个人量胸围和腰围：示例胸围100厘米，腰围80厘米" fill="none" stroke="#192536"><circle cx="330" cy="52" r="30" fill="#fff" stroke="#192536" stroke-width="3"/><path d="M315 81V98C288 101 254 103 244 124L214 225Q208 240 221 246Q234 251 241 234L264 164L275 223L269 290L283 365M345 81V98C372 101 406 103 416 124L446 225Q452 240 439 246Q426 251 419 234L396 164L385 223L391 290L377 365M283 365L316 365L330 277L344 365L377 365" fill="#f3f5f8" stroke="#192536" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M266 155C292 139 368 139 394 155M277 218C300 207 360 207 383 218" fill="none" stroke="#195ee8" stroke-width="3" stroke-dasharray="5 5"/><path d="M266 155C292 171 368 171 394 155M277 218C300 230 360 230 383 218" fill="none" stroke="#195ee8" stroke-width="8"/><path d="M400 155H475M389 218H475" fill="none" stroke="#195ee8" stroke-width="1.5"/><g fill="#195ee8" stroke="none" font-family="system-ui,sans-serif" font-size="23"><text x="492" y="163">胸围 100cm</text><text x="492" y="226">腰围 80cm</text></g></svg></div></section>

<section><h2><span class="num">03</span>程序照着重画</h2><div class="panel"><div class="controls"><div><label for="chest">胸围 <output id="chest-value" for="chest">110cm</output></label><input id="chest" type="range" min="90" max="120" step="10" value="110"></div><div id="waist-control"><label for="waist">腰围 <output id="waist-value" for="waist">80cm</output></label><input id="waist" type="range" min="70" max="100" step="10" value="80"></div></div><div class="comparison"><figure><figcaption>原来</figcaption><div id="before"></div></figure><figure><figcaption>改后</figcaption><div id="after"></div></figure></div><p id="response" class="caption" aria-live="polite">胸围大，图就宽。</p></div></section>

<section><h2><span class="num">04</span>缝住折角</h2><div class="panel fold"><svg viewBox="0 0 760 350" role="img" aria-label="平布上捏起一块三角形折角，再把它缝住，布面就能形成凸起。此图是形状示意。" fill="none" stroke="#195ee8"><circle cx="166" cy="160" r="115" fill="#edf3ff" stroke="#195ee8" stroke-width="3"/><path d="M166 160L126 268Q166 284 206 268Z" fill="#b9d0ff" stroke="none"/><path d="M126 268L166 160L206 268" fill="none" stroke="#195ee8" stroke-width="2.3" stroke-dasharray="6 6"/><circle cx="166" cy="160" r="5" fill="#195ee8" stroke="none"/><path d="M124 294Q139 306 155 293M208 294Q193 306 177 293M149 289L155 293L150 299M183 289L177 293L182 299" fill="none" stroke="#192536" stroke-width="2.5" stroke-linecap="round"/><path d="M321 169H400M386 156L400 169L386 182" fill="none" stroke="#192536" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M580 55L455 254Q580 319 705 254Z" fill="#edf3ff" stroke="#195ee8" stroke-width="3" stroke-linejoin="round"/><path d="M455 254C492 214 668 214 705 254" fill="none" stroke="#195ee8" stroke-width="1.8" stroke-dasharray="5 5"/><path d="M455 254C492 309 668 309 705 254" fill="none" stroke="#195ee8" stroke-width="3"/><path d="M580 55Q563 175 580 295" fill="none" stroke="#195ee8" stroke-width="2.5"/><path d="M573 132L587 134M572 149L586 151M571 166L585 168M571 183L585 185M572 200L586 202M573 217L587 219" fill="none" stroke="#195ee8" stroke-width="1.6"/></svg><p class="caption">平布就能鼓起来。这道折角，叫省道。</p></div></section>

<section><h2><span class="num">05</span>按图剪布，再缝好</h2><div class="panel finish"><svg viewBox="0 0 850 330" role="img" aria-label="把前片、后片和两片袖子按剪布图剪出来，再缝成上衣。组合图是示意，并非三维合身仿真。" fill="none" stroke="#195ee8"><svg id="cut-front" x="10" y="66" width="145" height="185" viewBox="-350 -15 700 560" aria-label="前片" fill="none" stroke="#195ee8"></svg><svg id="cut-back" x="155" y="66" width="145" height="185" viewBox="-350 -15 700 560" aria-label="后片" fill="none" stroke="#195ee8"></svg><svg id="cut-sleeve" x="305" y="66" width="115" height="185" viewBox="-250 -190 500 750" aria-label="袖片" fill="none" stroke="#195ee8"></svg><g fill="#192536" stroke="none" font-size="24" font-family="system-ui,sans-serif"><text x="351" y="282">×2</text></g><path d="M437 164H489M478 153L489 164L478 175" fill="none" stroke="#192536" stroke-width="3" stroke-linecap="round"/><path d="M627 57L583 72L521 209L551 224L600 130L590 276L745 276L735 130L784 224L814 209L752 72L708 57Q706 91 668 94Q630 91 627 57Z" fill="#edf3ff" stroke="#195ee8" stroke-width="3.5" stroke-linejoin="round"/><path d="M627 57Q627 103 668 106Q709 103 708 57M600 130L583 83M735 130L752 83M596 265H739M527 202L555 216M780 216L808 202" fill="none" stroke="#195ee8" stroke-width="1.4" stroke-dasharray="4 4"/><path d="M36 280L64 304M38 302L63 281" fill="none" stroke="#192536" stroke-width="2.5"/><circle cx="32" cy="277" r="7" fill="#fff" stroke="#192536" stroke-width="2"/><circle cx="33" cy="306" r="7" fill="#fff" stroke="#192536" stroke-width="2"/></svg><p class="caption">示意；试穿再调。</p></div></section>

let kind='fitted';
const $=s=>document.querySelector(s);
const path=d=>`<path d="${d}" fill="#edf3ff" stroke="#195ee8" stroke-width="2.7" vector-effect="non-scaling-stroke"/>`;
const picture=(d,label)=>`<svg viewBox="-355 -15 710 560" role="img" aria-label="${label}" fill="none" stroke="#195ee8">${path(d)}</svg>`;
function render(){
 const chest=Number($('#chest').value)*10,waist=Number($('#waist').value)*10;
 const sample=SAMPLES[kind][chest+'-'+waist],before=SAMPLES[kind]['1000-800'];
 $('#before').innerHTML=picture(before.front,'胸围100厘米、腰围80厘米的剪布图');
 $('#after').innerHTML=picture(sample.front,`按胸围${chest/10}厘米、腰围${waist/10}厘米重新画的剪布图`);
 $('#chest-value').textContent=chest/10+'cm';$('#waist-value').textContent=waist/10+'cm';
 $('#waist').disabled=kind==='straight';$('#waist-control').classList.toggle('disabled',kind==='straight');
 $('#response').textContent=kind==='straight'?'直身画法，不收腰。':'胸围大，图就宽；腰细，两侧收。';
 document.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.kind===kind)));
 $('#cut-front').innerHTML=path(sample.front);$('#cut-back').innerHTML=path(sample.back);$('#cut-sleeve').innerHTML=path(sample.sleeve);$('#cut-sleeve').setAttribute('viewBox',sample.sleeveBox);
}
$('#straight-picture').innerHTML=picture(SAMPLES.straight['1000-800'].front,'直身画法：两侧直落');
$('#fitted-picture').innerHTML=picture(SAMPLES.fitted['1000-800'].front,'收腰画法：两侧向里收');
document.querySelectorAll('[data-kind]').forEach(b=>b.addEventListener('click',()=>{kind=b.dataset.kind;render()}));
$('#chest').addEventListener('input',render);$('#waist').addEventListener('input',render);
render();
</script>
