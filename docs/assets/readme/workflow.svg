<svg xmlns="http://www.w3.org/2000/svg" width="800" height="456" viewBox="0 0 800 456" role="img" aria-labelledby="title desc">
<title id="title">Pattern Agent：从输入到可复核的服装证据</title>
<desc id="desc">流程示意，不是软件界面或仿真录像。01 输入设计意图、DXF 或已有工程；02 经 design-cloth 按需调用真实可用工具；03 保留同版纸样、网格、图与日志；04 由 verify-finish 汇总证据验收。有缺陷修复复验、缺证补采、阻塞写清恢复条件；数字检查不等于实物合身。</desc>
<rect width="800" height="456" rx="18" fill="#102b32"/>
<g font-family="Noto Sans CJK SC, sans-serif">
<text x="36" y="46" font-size="28" font-weight="700" fill="#ffffff">Pattern Agent · 纸样、工具与证据工作流</text>
<text x="36" y="76" font-size="16.5" fill="#b6d5d6">服装研究工具集 / garment patterns · skills · independent geometry checks</text>
<g fill="#f2f7f5">
<rect x="36" y="100" width="336" height="108" rx="12"/>
<rect x="428" y="100" width="336" height="108" rx="12"/>
<rect x="36" y="246" width="336" height="108" rx="12"/>
<rect x="428" y="246" width="336" height="108" rx="12"/>
</g>
<g fill="#163f43" font-size="21" font-weight="700">
<text x="54" y="132">01 输入与范围</text>
<text x="446" y="132">02 按需调用</text>
<text x="54" y="278">03 同版产物</text>
<text x="446" y="278">04 证据验收</text>
</g>
<g fill="#314e50" font-size="17.5">
<text x="54" y="164">设计意图 / DXF / 已有工程</text>
<text x="54" y="191">核对尺码、单位、姿势与环境</text>
<text x="446" y="164">design-cloth 选择可用路径</text>
<text x="446" y="191">先确认软件或桥接实际就绪</text>
<text x="54" y="310">纸样 / 网格 / 渲染图 / 日志</text>
<text x="54" y="337">保留来源、版本与输入对应</text>
<text x="446" y="310">verify-finish 汇总结论</text>
<text x="446" y="337">列明已验范围、缺口与复测</text>
</g>
<g stroke="#78cbb8" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M376 154h44m-9-8 9 8-9 8"/>
<path d="M596 212v15H204v15m-8-9 8 9 8-9"/>
<path d="M376 300h44m-9-8 9 8-9 8"/>
</g>
<rect x="36" y="370" width="728" height="34" rx="8" fill="#183f47"/>
<text x="52" y="393" font-size="16.5" fill="#d4eceb">复验闭环：有缺陷 → 修复复验　|　缺证 → 补采　|　阻塞 → 写清恢复条件</text>
<text x="36" y="434" font-size="16.5" fill="#f8daa5">流程示意，非运行回执。数字通过 ≠ 实物合身；历史 FAIL 与未验证项始终保留。</text>
</g>
</svg>
