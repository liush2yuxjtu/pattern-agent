<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc">
<title id="title">Pattern Agent：从输入到可复核的服装证据</title>
<desc id="desc">流程示意，不是软件界面或仿真录像。输入设计意图、DXF 或已有工程，经 design-cloth 选择当前可用工具，保留同版产物，由 verify-finish 按证据判定。证据不足则补采，发现缺陷则修复复验；数字检查不等于实物合身。</desc>
<rect width="1100" height="390" rx="20" fill="#102b32"/>
<g font-family="Noto Sans CJK SC, sans-serif">
<text x="40" y="56" font-size="30" font-weight="700" fill="#fff">Pattern Agent · 纸样、工具与证据之间的工作流</text>
<text x="40" y="89" font-size="17" fill="#b6d5d6">服装研究工具集 / garment patterns · skills · independent geometry checks</text>
<g fill="#f2f7f5"><rect x="40" y="128" width="220" height="120" rx="12"/><rect x="305" y="128" width="220" height="120" rx="12"/><rect x="570" y="128" width="220" height="120" rx="12"/><rect x="835" y="128" width="225" height="120" rx="12"/></g>
<g fill="#163f43" font-size="19" font-weight="700"><text x="58" y="160">01 输入与范围</text><text x="323" y="160">02 按需调用</text><text x="588" y="160">03 同版产物</text><text x="853" y="160">04 证据验收</text></g>
<g fill="#365455" font-size="16"><text x="58" y="192">设计意图 / DXF / 工程</text><text x="58" y="222">尺寸、单位、姿势、环境</text><text x="323" y="192">design-cloth 选择路径</text><text x="323" y="222">先确认工具实际可用</text><text x="588" y="192">纸样 / 网格 / 图 / 日志</text><text x="588" y="222">保留来源与输入对应</text><text x="853" y="192">verify-finish 汇总</text><text x="853" y="222">结论、缺口与复测条件</text></g>
<g stroke="#78cbb8" stroke-width="3" fill="none"><path d="M264 188h34m-8-8 8 8-8 8M529 188h34m-8-8 8 8-8 8M794 188h34m-8-8 8 8-8 8"/><path d="M944 254v35H416v-34m-8 8 8-8 8 8"/></g>
<text x="450" y="316" font-size="17" fill="#b6d5d6">有缺陷 → 修复复验　|　缺证 → 补采　|　阻塞 → 写清恢复条件</text>
<text x="40" y="358" font-size="18" fill="#f8daa5">流程示意，非运行回执。数字通过 ≠ 实物合身；历史 FAIL 与未验证项始终保留。</text>
</g></svg>