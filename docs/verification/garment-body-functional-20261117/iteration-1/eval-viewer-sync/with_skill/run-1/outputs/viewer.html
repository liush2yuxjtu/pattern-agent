<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Synthetic Body Proxy — Viewer Sync Control</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf0f3;color:#26313e;font:16px system-ui}main{display:flex;gap:32px;padding:28px;max-width:1100px;margin:auto}canvas{display:block;width:min(600px,100%);height:auto;min-width:0;background:white;border:1px solid #ccd3dc;align-self:flex-start}aside{width:320px;flex-shrink:0}label{display:block;margin:22px 0}input{width:100%}button{padding:10px;margin:0 5px 8px 0}small{display:block;margin:15px 0;color:#586677}output{float:right}@media(max-width:800px){main{flex-direction:column;padding:16px;gap:12px}aside{width:100%}canvas{max-height:65vh;width:auto;max-width:100%;margin:auto}}</style>
<main><canvas id="view" width="600" height="720"></canvas><aside><h1>Body proxy</h1><p>SYNTHETIC CONTROL · illustrative geometry</p><small>Synthetic proxy, not a measured person. Initial height is a 170 cm prior; units are assumed centimetres. Height scales vertical coordinates only. Front / side / back are rendered views.</small>
<label>Height <output id="heightValue"></output><input id="height" type="range" min="145" max="195" step="1"></label>
<label>Chest <output id="chestValue"></output><input id="chest" type="range" min="65" max="130" step="1"></label>
<label>Waist <output id="waistValue"></output><input id="waist" type="range" min="55" max="120" step="1"></label>
<label>Hip <output id="hipValue"></output><input id="hip" type="range" min="65" max="135" step="1"></label>
<button data-angle="0">Front</button><button data-angle="1.57079632679">Side</button><button data-angle="3.14159265359">Back</button><label>Rotate<input id="rotation" type="range" min="-180" max="180" value="0"></label><button id="reset">Reset final body</button><button id="export">Export current state</button><small id="status"></small></aside></main>
<script>
'use strict';
// Standalone file:// input: this mirrors body.json so no network/server is required.
const FINAL_BODY={version:2,height:170,chest:98,waist:74,hip:102,depth_ratio:0.78};
const CACHE_KEY='synthetic-body-viewer';
const MODEL_ID='synthetic-final-v2-170-98-74-102-r078';
const keys=['height','chest','waist','hip'];
const limits={height:[145,195],chest:[65,130],waist:[55,120],hip:[65,135]};
let state={...FINAL_BODY};
let cacheMessage='Final v2 defaults';
try {
 const raw=localStorage.getItem(CACHE_KEY),saved=raw?JSON.parse(raw):null;
 if(saved && saved.version===2 && saved.modelId===MODEL_ID && saved.params &&
    keys.every(k=>Number.isFinite(saved.params[k]) && saved.params[k]>=limits[k][0] && saved.params[k]<=limits[k][1]) && saved.params.depth_ratio===FINAL_BODY.depth_ratio){
  state={...FINAL_BODY,...saved.params,version:2};cacheMessage='Restored compatible v2 edit';
 }else if(raw){localStorage.removeItem(CACHE_KEY);cacheMessage='Discarded incompatible cache; final v2 defaults';}
}catch(e){cacheMessage='Invalid or unavailable cache; final v2 defaults';}
function persist(){try{localStorage.setItem(CACHE_KEY,JSON.stringify({version:2,modelId:MODEL_ID,params:{...state}}));}catch(e){cacheMessage='Storage unavailable; session edits only';}}
let angle=0;
function radii(c,r){const a=c/(Math.PI*(3*(1+r)-Math.sqrt((3+r)*(1+3*r))));return [a,a*r]}
function buildMesh(p){
 const vertices=[],faces=[];
 function loft(rows,cx=0){const start=vertices.length,n=48;
  for(const [y,rx,rz] of rows)for(let k=0;k<n;k++){const t=k*2*Math.PI/n;vertices.push([(cx+rx*Math.cos(t)),y*p.height/170,rz*Math.sin(t)])}
  for(let j=0;j<rows.length-1;j++)for(let k=0;k<n;k++){let a=start+j*n+k,b=start+j*n+(k+1)%n;faces.push([a,b,b+n],[a,b+n,a+n])}
  for(const row of [0,rows.length-1]){const ci=vertices.length;vertices.push([cx,rows[row][0]*p.height/170,0]);for(let k=0;k<n;k++)faces.push([ci,start+row*n+k,start+row*n+(k+1)%n])}
 }
 const c=radii(p.chest,p.depth_ratio),w=radii(p.waist,p.depth_ratio),h=radii(p.hip,p.depth_ratio);
 loft([[76,h[0]*.8,h[1]*.8],[88,...h],[98,h[0]*.95,h[1]*.95],[109,...w],[119,c[0]*.94,c[1]*.94],[128,...c],[138,c[0]*1.02,c[1]*.85],[145,9,6],[149,5,4]]);
 loft([[148,4,4],[151,7,7],[159,8,8],[166,6,6],[170,.3,.3]]);
 for(const sign of [-1,1]){loft([[0,4,6],[8,4,4],[39,5,5],[75,7,7],[85,7,7]],sign*8);loft([[80,3,3],[105,4,4],[128,5,5],[141,4,4]],sign*27)}
 return {vertices,faces};
}
// One mesh is shared by the renderer and the read-only diagnostic.
let mesh=buildMesh(state);
Object.defineProperty(window,'evalState',{value:()=>Object.freeze({version:state.version,params:Object.freeze({...state}),vertices:Object.freeze(mesh.vertices.map(v=>Object.freeze([...v])))}),writable:false,configurable:false});
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
function render(){ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
 const c=Math.cos(angle),s=Math.sin(angle),points=mesh.vertices.map(([x,y,z])=>[300+(x*c+z*s)*3.65,690-y*3.65,-x*s+z*c]);
 const ordered=mesh.faces.map((f,i)=>({f,i,z:f.reduce((a,j)=>a+points[j][2],0)/3})).sort((a,b)=>a.z-b.z);
 for(const {f,i} of ordered){ctx.beginPath();ctx.moveTo(points[f[0]][0],points[f[0]][1]);for(const j of f.slice(1))ctx.lineTo(points[j][0],points[j][1]);ctx.closePath();ctx.fillStyle=`hsl(213,18%,${58+(i%9)*2}%)`;ctx.fill()}
 ctx.fillStyle='#344153';ctx.font='13px system-ui';ctx.fillText('SYNTHETIC CONTROL / assumed scale',16,24);
 document.querySelector('#status').textContent=`${cacheMessage} · model v${state.version} · ${mesh.vertices.length} vertices · ${mesh.faces.length} triangles`;
}
for(const key of ['height','chest','waist','hip']){const input=document.getElementById(key),label=document.getElementById(key+'Value');input.value=state[key];label.value=state[key]+' cm';input.addEventListener('input',()=>{state[key]=Number(input.value);label.value=state[key]+' cm';mesh=buildMesh(state);persist();render()})}
for(const b of document.querySelectorAll('button'))b.onclick=()=>{angle=Number(b.dataset.angle);document.getElementById('rotation').value=angle*180/Math.PI;render()};
document.getElementById('reset').onclick=()=>{state={...FINAL_BODY};mesh=buildMesh(state);cacheMessage='Reset to final v2 defaults';for(const k of keys){document.getElementById(k).value=state[k];document.getElementById(k+'Value').value=state[k]+' cm';}persist();render();};
document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify(window.evalState(),null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='current-body-state.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
document.getElementById('rotation').oninput=e=>{angle=Number(e.target.value)*Math.PI/180;render()};render();
</script></html>
