尺寸推导:
  计算状态: 未计算：缺少净体、已选松量规则、实测材料和批准成衣目标。
  三层口径:
    净体: 人体尺寸及测量方法。
    成衣: 穿着效果的目标尺寸及度法。
    纸样净尺寸: 作图的净样尺寸，显式记录缩水与下垂补偿。
    毛样: 在净样基础上按边添加已批准的缝份、折边等工艺余量。
  成衣计算说明: |-
    成衣尺寸 = 净体尺寸 + 基准松量 + 面料弹性调整 + 厚度工艺补偿。
    各调整量带正负号和来源，缺项不按零处理。
  松量取值依据:
    品类: T恤
    合体度: 贴身外观，定量值待确认
    穿着层次: 待输入
    规则版本: 未选定
    本款已采用条目: []
  方向处理: |-
    经纬或纵横方向分别记录；不能以一个整体弹性或缩水率覆盖全部部位。
    裁片旋转时重新确认材料方向映射。
  缩水口径:
    资料中的表达: 纸样尺寸 = 成衣尺寸 ×（1 + 方向缩水率）− 针织长度向下垂补偿。
    采用条件: |-
      先明确该百分数是洗后尺寸变化、预定补偿率还是已批准的补偿系数。
      不能混用符号。
    本文件洗后变化定义: |-
      洗后尺寸变化率 =（洗后长度 − 洗前长度）÷ 洗前长度；收缩为负，
      伸长为正。
    仅考虑一次缩水的换算: |-
      在无下垂且忽略工艺耦合时，
      洗前所需长度 = 洗后目标长度 ÷（1 + 洗后尺寸变化率）。
    补偿系数定义: |-
      若采用已批准的补偿系数k，
      则纸样净尺寸 = 成衣目标尺寸 × k − 已批准的下垂补偿。
      记录每项的处理先后和依据。
    挂牌数据处理: |-
      候选甲的宽长向负5%继续保存为挂牌尺寸变化；未实测、未选料，
      不转成本款补偿值，也不重复放大已有几何。
  针织下垂: 按实际悬垂试验、方向、受力和部位取值；不只凭克重查到一个通用补偿数。
  单位衔接: 厘米目标进入U单位作图前，必须确认每U毫米数；本轮未标定。
  测量方法: |-
    使用明确的起止点、净样线和围度或平量口径；
    袖窿、领圈等弧长按命名接口量取。
