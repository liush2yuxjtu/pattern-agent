款式特征:
  品类: 女式针织贴身长袖圆领T恤
  标注尺码: M
  衣身轮廓: 前后衣身分片，腰部内收，下摆比腰部展开。
  领口: 前领较深、后领较浅的圆领，另有长条形领部裁片。
  袖子: 独立长袖，从腋下逐渐收窄到袖口；外形接近一片装袖。
