术语说明:
  领肩点: 领口和肩线相交的点。
  肩端点: 肩线与袖窿相接的点。
  袖窿: 衣身上用来装袖子的那一圈开口。
  袖山: 袖片顶部与袖窿相接的弧形部分。
  缝份: 缝合线外侧，为车缝预留的布量。
  折边: 下摆或袖口向内折进去的布量。
  净样: 表示缝合后形状的纸样线，通常不包括缝份。
  裁剪样: 在净样基础上加入缝份、折边等裁剪余量的纸样，也常叫毛样。
  剪口: 缝制时用于把相关位置对齐的小标记。
  松量: 衣服尺寸相对人体尺寸增加或减少的量，需结合材料与穿着效果决定。
  吃势: 两段要缝合的边中，一段有意略长，缝制时把多出的长度分配到指定区间。
  归拔: 通过整烫或拉伸调整局部形状和长度，具体做法与材料有关。
  接口: 明确命名的一段或几段边线，表示可能与哪一块裁片连接。
  正向与反向: 正向按点列顺序走，反向按相反顺序走；这不自动决定缝纫机的进布方向。
  净体尺寸: 人体本身的尺寸，不含衣服松量。
  成衣目标尺寸: 按指定测量方法，要求成衣最终达到的尺寸。
  纸样净尺寸: |-
    考虑已批准的缩水和下垂补偿后，用于净样作图的尺寸；
    与加缝份后的毛样尺寸分开。
  缝级关系: 具体哪条边与哪条边相接，并记录对位、方向和等长、吃势或比例的匹配条件。
  边链: 按明确顺序连接的多段边，整体作为一个匹配对象。
  硬约束: 方案必须满足的条件，不能由优化权重放宽。
  软目标: 在硬约束全部满足后，才可按优先级改善的外形或误差目标。
  拦截级: 不满足时不能作为通过的生产结果交付。
  告警级: 记录具体风险及处理结论，只有获得所需确认后才能放行。

