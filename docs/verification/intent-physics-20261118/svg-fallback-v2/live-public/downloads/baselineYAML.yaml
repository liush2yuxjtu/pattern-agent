按角色阅读:
  图形程序: |-
    先读文件约定、单位、命名接口和完整二维几何；本版可独立重建，
    五阶段自动制版另按各阶段状态处理。
  纸样设计人员: |-
    先读款式、尺寸推导和原型分层，
    再核对纸样尺寸、接口、缝级关系和净样毛样状态。
  缝制人员: |-
    先读缝制交接卡与裁剪清单，
    再查缝级关系的对位、吃势、配比以及每项工艺是否批准。

# 二 缝制交接与确认
缝制交接卡:
  工序性质: 针对此款结构整理的建议顺序；最终平装袖或其他做法由批准工艺确定。
  缝制人员先看:
  - 裁剪清单中哪些值已确认。
  - 连接关系中的接口、方向、对位点与长度差。
  - 缝份、折边、针迹和材料参数。
  - 缝级关系图中的前后袖山分段；未对应的区段不可按总长度猜配。
  工序:
  - 工序号: 1
    工序名称: 开工确认
    做什么: 确认比例、材料、裁数、线的用途和工艺值。
    对位和准备: 先读本文件的生产确认项。
    完成检查: 生产确认项全部完成。
    工序状态: 建议顺序，未确认的生产条件完成前不放行
  - 工序号: 2
    工序名称: 合肩
    做什么: 连接前后片的两条肩缝。
    对位和准备: 领肩点、肩端点分别对应；片面方向与吃势先确认。
    完成检查: 肩部平顺，领肩与肩端对位正确。
    工序状态: 建议顺序，未确认的生产条件完成前不放行
  - 工序号: 3
    工序名称: 领口处理
    做什么: 按已确认方案处理领条与前后领圈。
    对位和准备: 领条接头位置、折叠宽度、配比和分段标记先确认。
    完成检查: 领口平顺、尺寸符合批准目标，没有扭转。
    工序状态: 建议顺序，未确认的生产条件完成前不放行
  - 工序号: 4
    工序名称: 装袖
    做什么: 将每只袖子的袖山连接到对应衣身袖窿。
    对位和准备: 先确认哪半袖山配前、哪半配后；肩端和腋下对位。
    完成检查: 前后袖山分段匹配，吃势落在指定区间。
    工序状态: 建议顺序，未确认的生产条件完成前不放行
  - 工序号: 5
    工序名称: 合侧缝和袖底
    做什么: 按批准的缝制顺序连接侧缝与袖底缝。
    对位和准备: 腋下交点对齐；归拔注释的具体区段和方法先确认。
    完成检查: 两侧对应、袖底平顺，不能靠强拉硬凑边长。
    工序状态: 建议顺序，未确认的生产条件完成前不放行
  - 工序号: 6
    工序名称: 袖口和下摆收边
    做什么: 按批准的折边量和针迹处理袖口与下摆。
    对位和准备: 先区分折线、缝线与裁剪线。
    完成检查: 左右一致，收边平整，成品宽度符合批准目标。
    工序状态: 建议顺序，未确认的生产条件完成前不放行
  - 工序号: 7
    工序名称: 成品核对
    做什么: 检查领口、肩袖、侧缝与下摆，再按批准尺寸表量成衣。
    对位和准备: 检查对称、扭转、起皱、跳针和活动需求。
    完成检查: 达到批准尺寸与外观要求；实际合身仍以试穿为准。
    工序状态: 建议顺序，未确认的生产条件完成前不放行
