# 一 文件约定与款式
文件约定:
  名称: 女式贴身长袖圆领T恤 独立设计与制缝规格
  格式版本: '1.1'
  纸样版本: 基准版，当前没有改款
  文件用途: |-
    独立保存当前二维设计，
    并交接款式识别、尺寸推导、结构决策、绘图执行、版型校验和缝制信息。
  适用读者:
  - 图形读取与处理程序
  - 纸样设计人员
  - 裁剪与缝制人员
  外部设计文件依赖: []
  几何清单预期:
    裁片: 4
    折线: 126
    直线: 78
    文字: 27
    折线顶点: 1487
  独立重建范围: |-
    根据本文件的坐标、线型、文字和排版位置生成二维纸样，

    不需要其他设计文件或照片。
  独立重建不代表: 二维图形可以重建，不等于实际毫米比例、裁数、缝份和缝制参数已经批准。
  名称约定: |-
    裁片名、线名、点名和接口名在本文件中唯一对应；

    同一裁片内按完整名称精确匹配。
  图中文字的效力: |-
    图形中的尺码、Quantity、面料代号及加工注释只作为显示文字；

    裁数、用料和工艺以本文件对应的批准字段为准。
  状态约定:
    已定义: 本文件明确给出的图形或说明。
    待确认: 含义或生产参数尚未定，不可作为自动生产的确定输入。
    建议: 可供评审的工艺安排，尚未放行。
  规格修订: 加入五阶段制版流程、尺寸推导、原型分层和缝级校验；二维基准形状不变。
  空值约定: |-
    null表示当前没有确认的数值；不等于零，
    不得自动填入资料示例或经验默认值。
  流程与现状的区别: |-
    流程字段说明下一次改版应交付什么；
    其中尚未计算或执行的项目直接标记状态，不改变现有二维点位。
单位与坐标:
  坐标单位: U
  U的含义: 本设计采用的图形长度单位。
  实际比例:
    状态: 未标定
    要求: 确认每U对应多少毫米后，才能生成实际尺寸的裁剪任务。
