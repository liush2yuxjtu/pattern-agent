  角度单位: 度
  长度比单位: 无单位
  横向正方向: 向右
  高度正方向: 向上
  局部点到总图: 总图点的横与高，分别等于本片排版放置点的横与高，加上局部点的横与高。
  左右含义: 线名中的图面左和图面右指平放图的左右，不自动等同穿着者左右。
  点位精度: 六位小数用于保持图形，不代表实际裁剪精度。
  端点处理: 保留每条线列出的端点，不自动补线、镜像、平滑或合并。
